[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvolley-pydatavolley" 
version = "1.0.0"
authors = [{name = "Tyler Widdison", email = "tylerperrywiddison@gmail.com"}]
description = "Extract data from DataVolley .dvw files and VolleyStation .vsm files"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[tool.ruff.lint]
extend-select = ["DTZ"]

[tool.hatch.build.targets.wheel]
include = [
    "datavolley/",
    "datavolley/data/*.dvw"
]

[project.urls]
Homepage = "https://github.com/openvolley/py-datavolley"
Repository = "https://github.com/openvolley/py-datavolley.git"
Issues = "https://github.com/openvolley/py-datavolley/issues"
